<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-base" content="%BASE_URL%" />
    <meta name="theme-color" content="#0e0f11" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>TechPickr - The right PC. Without the guesswork.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const communityRoute = new URLSearchParams(window.location.search).get("route");
      if (communityRoute && communityRoute.startsWith("/")) {
        const appBase = document.querySelector('meta[name="app-base"]').content.replace(/\/$/, "");
        history.replaceState(null, "", `${appBase}${communityRoute}`);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
